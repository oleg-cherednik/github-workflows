name: 'Build and run tests under Java using Gradle'
on:
  workflow_call:
    inputs:
      java-version:
        description: 'Version of Java to compile against and run tests on'
        type: string
        required: true
      gradle-java-version:
        description: 'Version of Java that runs Gradle itself (defaults to java-version).
                      Set this when a build plugin requires a newer JDK than java-version.'
        type: string
        required: false
        default: ''
      codacy-report:
        description: 'Send or not test coverage report to Codacy'
        type: boolean
        required: false
        default: false
#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: true
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      # the last version in the list becomes JAVA_HOME, i.e. the JDK that runs Gradle;
      # every installed version is also exposed as JAVA_HOME_<version>_X64 for toolchains
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: |
            ${{ inputs.java-version }}
            ${{ inputs.gradle-java-version || inputs.java-version }}
          distribution: 'corretto'
          cache: 'gradle'
      - name: Run a build
        run: ./gradlew compileJava --stacktrace -Ptest.java.version=${{ inputs.java-version }}
      - name: Run tests
        run: ./gradlew test -Ptest.java.version=${{ inputs.java-version }}
      # the HTML report carries the full assertion messages, the XML results carry
      # the stack traces; both are only useful when something actually failed
      - name: Upload test report
      #        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-java-${{ inputs.java-version }}
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
          if-no-files-found: ignore
      - name: Send test coverage report to Codacy
        if: ${{ inputs.codacy-report }}
        uses: oleg-cherednik/github-workflows/.github/actions/codacy-coverage-reporter@main
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
